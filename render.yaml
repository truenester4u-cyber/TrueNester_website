services:
  - type: web
    name: TrueNester_api
    env: node
    region: oregon
    plan: free
    branch: main
    rootDir: truenester-chatbot-api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
